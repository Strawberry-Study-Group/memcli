name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: memcore-Linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: memcore-Darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: memcore-Darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: memcore-Windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ONNX Runtime
        shell: bash
        run: |
          pip install onnxruntime
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ORT_PATH=$(python3 -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi', 'onnxruntime.dll'))")
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ORT_PATH=$(python3 -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi', 'libonnxruntime.dylib'))")
          else
            ORT_PATH=$(python3 -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi', 'libonnxruntime.so'))")
          fi
          echo "ORT_DYLIB_PATH=$ORT_PATH" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --features embedding --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ matrix.name }}"
          # Strip .exe suffix for archive base name
          BASE_NAME="${ARCHIVE_NAME%.exe}"

          mkdir -p staging/{memories,index}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/memcore.exe staging/
          else
            cp target/${{ matrix.target }}/release/memcore staging/
          fi

          # Bundle model files if present
          if [ -d models ]; then
            cp -r models staging/
          fi

          # Bundle ONNX Runtime shared library for load-dynamic
          ORT_DIR=$(python3 -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi'))")
          mkdir -p staging/lib
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$ORT_DIR"/onnxruntime*.dll staging/lib/ 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp "$ORT_DIR"/libonnxruntime*.dylib staging/lib/ 2>/dev/null || true
          else
            cp "$ORT_DIR"/libonnxruntime*.so* staging/lib/ 2>/dev/null || true
          fi

          # Bundle skill docs
          cp SETUP.md staging/setup.md
          cp SKILL.md staging/skill.md
          cp SLEEP.md staging/sleep.md

          # Create tar.gz (or zip for Windows)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd staging && 7z a -tzip "../${BASE_NAME}.zip" . && cd ..
          else
            tar -czf "${BASE_NAME}.tar.gz" -C staging .
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
